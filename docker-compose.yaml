name: flowise-ats

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/0
  volumes:
    - cv_storage:/app/storage
  networks:
    - ats_network
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ats_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ats_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ats_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ats_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ats_network

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ats_network

  # ---------------------------------------------------------------
  # Application (profile: app) - نفعّلها بعد ما نجهز Dockerfile والكود
  # ---------------------------------------------------------------
  api:
    <<: *backend-common
    container_name: ats_api
    profiles: ["app"]
    restart: unless-stopped
    command: fastapi run app/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  worker:
    <<: *backend-common
    container_name: ats_worker
    profiles: ["app"]
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  flower:
    <<: *backend-common
    container_name: ats_flower
    profiles: ["app"]
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app flower --port=5555
    ports:
      - "5555:5555"

networks:
  ats_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:
  redis_data:
  cv_storage: